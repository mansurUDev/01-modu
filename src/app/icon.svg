  <g>
    <rect x="10" y="16" width="8" height="32" rx="3" fill="#E8E6E1"/>
    <rect x="22" y="16" width="8" height="32" rx="3" fill="#E8E6E1"/>
    <rect x="34" y="16" width="8" height="32" rx="3" fill="#E8E6E1"/>
    <rect x="46" y="16" width="8" height="32" rx="3" fill="#FF4A1F"/>
  </g>
</svg>
